<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solares de Donato — Desarrolladora inmobiliaria y constructora." />
    <!-- Abre la conexión al API (fotos + datos) mientras baja el bundle. Vite reemplaza
         %VITE_API_URL% en el build; preconnect ignora el path. -->
    <link rel="preconnect" href="%VITE_API_URL%" />
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;1,200;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Vista previa al compartir el link (WhatsApp, Facebook, LinkedIn, etc.).
         Si cambia el dominio, actualizar la URL absoluta de la imagen. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solares de Donato" />
    <meta property="og:title" content="Solares de Donato" />
    <meta property="og:description" content="Desarrolladora inmobiliaria y constructora." />
    <meta property="og:image" content="https://solaresdedonato-web.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://solaresdedonato-web.vercel.app/og-image.png" />
    <title>Solares de Donato</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
